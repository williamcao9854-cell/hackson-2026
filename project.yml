# 备用方案：如果 Wuling.xcodeproj 打不开，用 XcodeGen 重新生成
#   brew install xcodegen && xcodegen generate
name: Wuling
options:
  bundleIdPrefix: com.hackson2026
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: zh-Hans
targets:
  Wuling:
    type: application
    platform: iOS
    sources:
      - path: Wuling
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hackson2026.wuling
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Wuling-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: 物灵
        INFOPLIST_KEY_NSCameraUsageDescription: 物灵需要使用相机，拍下你想唤醒的旧物。照片只在手机上处理，不会上传。
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: WulingWidgetExtension
  # 小组件（桌面「园林」、锁屏「节气」）：不用 App Groups，免费开发者账户也能装
  WulingWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: WulingWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hackson2026.wuling.widget
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: WulingWidget-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: 物灵
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
